name: secret-scan

# Reusable secret-scanning gate. Drop this file into a repo's .github/workflows/.
# Uses the MIT-licensed gitleaks CLI directly (NOT the gitleaks-action, which
# requires a paid license for org-owned repos beyond the first).
#
# The check that appears on the PR is named "secret-scan" (the job id below).
# When requiring this as a status check in an org ruleset, require "secret-scan".

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history on PRs so we scan the whole diff range)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          VERSION=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}" -o "$TARBALL"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "$TARBALL" gitleaks
          gitleaks version

      - name: Scan pushed/PR commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          # Compute the git range to scan. Passed via env (not inline GitHub Actions
          # expressions) so a branch or SHA can never break out of the shell.
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR: scan exactly the commits the PR introduces.
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$PUSH_AFTER" = "$ZERO" ]; then
            # Branch DELETE push: the after-SHA is all-zeros and there are no
            # commits to scan (the ref is gone). Nothing to do.
            echo "Branch deletion push (after-SHA is all-zeros); nothing to scan."
            exit 0
          elif [ "$PUSH_BEFORE" = "$ZERO" ] || [ -z "$PUSH_BEFORE" ]; then
            # First push to a new branch (or a deleted-then-recreated ref): there is
            # no "before" commit, so github.event.before is all-zeros. A
            # ${ZERO}..HEAD range is invalid and gitleaks errors out. Fall back to
            # scanning just the tip commit, which is all this push actually added
            # that a PR gate wouldn't already have covered.
            RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
            # If the tip is a root commit (no parent), ~1 doesn't resolve; scan the
            # single commit by itself.
            if ! git rev-parse --verify --quiet "${PUSH_AFTER}~1" >/dev/null; then
              RANGE="$PUSH_AFTER"
            fi
          else
            # Normal push to an existing branch: scan what this push added.
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          # Backstop: a usable range must never contain the null SHA and must be
          # non-empty. This mirrors scripts/compute-scan-range.sh so the two stay
          # in lockstep (asserted by the secret-scan-selftest sync check).
          case "$RANGE" in
            *"$ZERO"*) echo "::error::computed an invalid range containing the null SHA: $RANGE"; exit 1 ;;
            "") echo "::error::computed an empty range"; exit 1 ;;
          esac
          # A force push (for example history rewritten to remove a secret)
          # leaves the old tip out of the clone. Scan the new tip commit, as for
          # a first push, rather than leave a red check that never clears.
          # (Covered by tests/gate-scan-behaviour.sh, not the range bats suite.)
          if [ "$EVENT_NAME" = push ] && [ "${PUSH_FORCED:-}" = true ] &&
             ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::Force push: the previous tip $PUSH_BEFORE is not in the clone, so only the new tip commit is scanned."
            RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
            if ! git rev-parse --verify --quiet "${PUSH_AFTER}~1" >/dev/null; then
              RANGE="$PUSH_AFTER"
            fi
          fi
          # gitleaks exits 0 when git cannot run its log over the range (a sha
          # that is not in the clone, an unsupported flag), which would pass
          # the gate without scanning anything. Run the same git log first and
          # fail the check if git cannot.
          if ! err=$(git log -p -U0 "$RANGE" 2>&1 >/dev/null); then
            echo "::error::git cannot read the scan range $RANGE: ${err:0:300}"
            exit 1
          fi
          echo "Scanning range: $RANGE"
          # Nothing is written into the checkout: the PR controls every path
          # there, and a symlink could redirect a write onto the gitleaks
          # binary itself. Reports go to the runner's temp folder.
          REPORTS="${RUNNER_TEMP:?}/gitleaks-reports"
          mkdir -p "$REPORTS"
          SECRET_HELP="If this is a real credential, ROTATE IT immediately, then remove it from history. (If it is a genuine example/placeholder, add a '# gitleaks:allow' comment on the line.)"
          gitleaks git \
            --log-opts="$RANGE" \
            --redact \
            --config .gitleaks.toml \
            --exit-code 1 \
            --report-format sarif \
            --report-path "$REPORTS/gitleaks.sarif" || {
              echo "::error::Potential secret detected. Review the log above. $SECRET_HELP";
              exit 1;
            }
          # git log -p shows no diff for a merge commit, so a secret typed while
          # resolving a conflict would pass. A merge line counts as new only when
          # two views agree: it is added relative to EVERY parent (one diff per
          # parent; git's combined diff can need gigabytes on long rewritten
          # files), and the remerge diff adds it relative to the automatic merge
          # (which pairs renames that a plain diff may not). Octopus merges cannot
          # be remerged and cannot have conflicts: the parent diffs alone.
          # For each parent, the merge's copy of every file with new lines is
          # committed over the parent's copy in a throwaway repo, and gitleaks
          # scans that commit exactly as it scans an ordinary one (gitleaks dir
          # would skip files whose names contain .br, .tar, .zip and similar,
          # such as .browserslistrc). A finding counts if it touches a new line.
          MERGES=$(mktemp -d "${RUNNER_TEMP:?}/merge-lines.XXXXXX")
          # -I: never import modules from the checkout (a repo's re.py).
          python3 -I - "$RANGE" "$MERGES" <<'PY' || {
          import codecs, collections, json, os, re, subprocess, sys
          rng, root = sys.argv[1], sys.argv[2]
          # The runner's own git config (global and system) is ignored, so it
          # cannot change what the diffs show; the repo's config comes from
          # actions/checkout. The options are pinned as well: diff.noprefix
          # would drop the b/ prefix, diff.interHunkContext would add context.
          ENV = dict(os.environ, GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM="1")
          DIFF = ("-U0", "-M", "--inter-hunk-context=0", "--no-color", "--no-ext-diff",
                  "--src-prefix=a/", "--dst-prefix=b/")
          HUNK = re.compile(rb"@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@")
          def git(*args, data=None, env=None):  # any git failure fails the check
              return subprocess.run(("git", "-c", "core.quotePath=false") + args, input=data,
                                    env=env or ENV, check=True, stdout=subprocess.PIPE).stdout
          def stream(*args):  # a git command's output, line by line
              proc = subprocess.Popen(("git", "-c", "core.quotePath=false") + args,
                                      env=ENV, stdout=subprocess.PIPE)
              yield from proc.stdout
              if proc.wait():
                  raise subprocess.CalledProcessError(proc.returncode, args)
          def unquote(path):
              if path[:1] == b'"' and path[-1:] == b'"':
                  return codecs.escape_decode(path[1:-1])[0]
              return path
          def added(lines):  # (path, result line number, text) of each '+' line of a diff
              path = line_no = None
              for line in lines:
                  line = line[:-1] if line.endswith(b"\n") else line
                  if line.startswith(b"diff --git "):
                      path = line_no = None
                  elif line_no is None and line.startswith(b"+++ "):
                      # git ends this line with a tab when the path has a space
                      target = unquote(line[4:-1] if line.endswith(b"\t") else line[4:])
                      path = target[2:] if target.startswith(b"b/") else None
                  elif HUNK.match(line):
                      line_no = int(HUNK.match(line).group(1))
                  elif line_no is not None and line[:1] in (b"+", b" ", b""):
                      # '+' is new; ' ' (or empty, with diff.suppressBlankEmpty) is
                      # context, which still takes a result line number.
                      if line[:1] == b"+" and path is not None:
                          yield path, line_no, line[1:]
                      line_no += 1
          def numstat(parent, merge):  # (insertions, {result path: renamed from}, binary paths)
              # --numstat is never translated; with -z a rename's source and result
              # paths follow its counts as separate fields.
              rows = git("diff", "--numstat", "-z", "-M", "--no-ext-diff", parent, merge).split(b"\0")
              total, sources, binary, i = 0, {}, set(), 0
              while i < len(rows) - 1:
                  count, _, path = rows[i].split(b"\t", 2)
                  if not path:
                      sources[rows[i + 2]] = rows[i + 1]
                      path, i = rows[i + 2], i + 2
                  if count == b"-":
                      binary.add(path)
                  else:
                      total += int(count)
                  i += 1
              return total, sources, binary
          def tree_oids(commit, paths, kind=b"blob"):  # {path: id} for the paths of that kind in commit
              # Paths go to ls-tree as arguments, so any byte (a newline, a CR) works;
              # --full-tree reads them from the top of the tree, as the diffs show them.
              wanted, oids = list(paths), {}
              for i in range(0, len(wanted), 200):
                  listing = git("--literal-pathspecs", "ls-tree", "--full-tree", "-r", "-z", commit, "--",
                                *wanted[i:i + 200])
                  for entry in listing.split(b"\0")[:-1]:
                      meta, path = entry.split(b"\t", 1)
                      if meta.split()[1] == kind and path in paths:
                          oids[path] = meta.split()[2]
              return oids
          def blob_lines(parent, paths):  # {path: its set of lines in parent}, files only
              oids = tree_oids(parent, paths)
              out = git("cat-file", "--batch", data=b"".join(oid + b"\n" for oid in oids.values()))
              found, pos = {}, 0
              for path in oids:
                  end = out.index(b"\n", pos)
                  header, pos = out[pos:end].split(), end + 1
                  if len(header) != 3 or not header[2].isdigit():
                      continue  # missing, or a submodule (git 2.51+): no content follows
                  size = int(header[2])
                  found[path] = set(out[pos:pos + size].split(b"\n"))
                  pos += size + 1
              return found
          def go_text(path):  # a path as gitleaks' JSON report shows it (Go: U+FFFD per bad byte)
              out, i = [], 0
              while i < len(path):
                  for n in (1, 2, 3, 4):
                      try:
                          out.append(path[i:i + n].decode("utf-8"))
                          i += n
                          break
                      except UnicodeDecodeError:
                          pass
                  else:
                      out.append("�")
                      i += 1
              return "".join(out)
          OBJECTS = os.fsencode(os.path.abspath(os.fsdecode(git("rev-parse", "--git-path", "objects").strip())))
          MARKERS = (b"<<<<<<<", b">>>>>>>")  # conflict-marker lines, labelled with commit subjects
          for merge in git("rev-list", "--merges", rng).decode().split():
              parents = git("rev-list", "--parents", "-n", "1", merge).decode().split()[1:]
              stats = {parent: numstat(parent, merge) for parent in parents}
              # 1. Lines added relative to every parent. The parent with the fewest
              #    insertions goes first, so memory stays bounded by that diff. A
              #    parent whose copy of a path is binary has no lines to compare, so
              #    it is left out for that path: the path's lines come from the next
              #    parent with a text diff ("pending" until then).
              new, pending = {}, None
              for parent in sorted(parents, key=lambda parent: stats[parent][0]):
                  binary = stats[parent][2]
                  seen, fresh = set(), {}
                  for path, line_no, text in added(stream("diff", *DIFF, parent, merge)):
                      if pending is None or path in pending:
                          if line_no in fresh.setdefault(path, {}):
                              sys.exit(f"line {line_no} of {path!r} seen twice in merge {merge}")
                          fresh[path][line_no] = text
                      elif line_no in new.get(path, ()):
                          seen.add((path, line_no))
                  if pending is not None:
                      new = {path: lines if path in binary else
                             {n: t for n, t in lines.items() if (path, n) in seen}
                             for path, lines in new.items()}
                  new.update(fresh)
                  pending = binary if pending is None else pending & binary
              # 2. For two-parent merges, the texts the remerge diff adds relative to
              #    the automatic merge (which pairs renames a plain diff may not).
              #    Nothing is deleted here, so a run stays whole: a line the remerge
              #    diff does not add is only not fresh (step 3). Pinned: diff3
              #    conflict styles would put base lines in the automatic merge.
              remerged, binary = None, set()
              # (--text: the automatic merge can look binary when neither parent
              # does, for example a NUL byte moved into the first 8000 bytes)
              if len(parents) == 2 and any(new.values()):
                  wanted = {path: set(lines.values()) for path, lines in new.items()}
                  remerged = collections.defaultdict(set)
                  for path, _, text in added(stream("-c", "merge.conflictStyle=merge", "show",
                                                    "--remerge-diff", "--text", "--format=", *DIFF, merge)):
                      if text in wanted.get(path, ()):
                          remerged[path].add(text)
                  binary = stats[parents[0]][2] | stats[parents[1]][2]
              # 3. A line is fresh when its text is in no parent's copy of the file
              #    (or the file it was renamed from) and, for a two-parent merge, the
              #    remerge diff adds it (a binary path, where the automatic merge may
              #    keep the binary copy, and a conflict marker, labelled with commit
              #    subjects there, count as added). Written to <merge>.json: after
              #    the scan, a finding counts only if it touches a fresh line.
              old = collections.defaultdict(set)
              for parent in parents:
                  sources = stats[parent][1]
                  want = {sources.get(path, path): path for path, lines in new.items() if lines}
                  for source, lines in blob_lines(parent, want).items():
                      old[want[source]] |= lines
              fresh, paths = {}, []
              for path, lines in new.items():
                  here = {n for n, t in lines.items() if t not in old[path] and (
                      remerged is None or path in binary or t.startswith(MARKERS)
                      or t in remerged[path])}
                  if not here:
                      continue
                  rel = os.path.normpath(os.fsdecode(path))
                  if os.path.isabs(rel) or rel.split(os.sep)[0] == "..":
                      sys.exit(f"unexpected path {rel!r} in merge {merge}")
                  paths.append(path)
                  fresh.setdefault(go_text(path), set()).update(here)
              if not paths:
                  continue
              with open(os.path.join(root, merge + ".json"), "w") as fh:
                  json.dump({path: sorted(lines) for path, lines in fresh.items()}, fh)
              # 4. One throwaway repo per parent, reading this repo's objects: a
              #    commit with the parent's copy of each file that has fresh lines
              #    (or the file it was renamed from), then one with the merge's
              #    copy. gitleaks sees exactly the diff an ordinary commit on that
              #    parent would show (its hunks, whole multi-line keys, real line
              #    numbers). No files on disk and no index, so the merge's own
              #    .gitattributes, .gitignore and .gitleaksignore are never applied.
              #    Fixed dates keep the commit ids (and fingerprints) stable. Views are
              #    numbered as git numbers the parents (parent 1 is the merge's first).
              merge_files = tree_oids(merge, paths)
              # Each path with new lines is a file in the merge, or a submodule (its
              # "Subproject commit" line). A path the lookup cannot find would be
              # scanned as empty, so it fails the check.
              missing = [path for path in paths if path not in merge_files]
              lost = set(missing) - set(tree_oids(merge, missing, b"commit"))
              if lost:
                  sys.exit(f"paths with new lines not found in merge {merge}: {sorted(lost)!r}")
              env = dict(ENV, GIT_AUTHOR_NAME="secret-scan", GIT_AUTHOR_EMAIL="secret-scan@invalid",
                         GIT_COMMITTER_NAME="secret-scan", GIT_COMMITTER_EMAIL="secret-scan@invalid",
                         GIT_AUTHOR_DATE="@0 +0000", GIT_COMMITTER_DATE="@0 +0000")
              for number, parent in enumerate(parents, 1):
                  sources = stats[parent][1]
                  parent_files = tree_oids(parent, {sources.get(path, path) for path in paths})
                  scan = os.path.join(root, f"{merge}.{number}")
                  git("init", "-q", scan)
                  os.makedirs(os.path.join(scan, ".git", "objects", "info"), exist_ok=True)
                  with open(os.path.join(scan, ".git", "objects", "info", "alternates"), "wb") as fh:
                      fh.write(OBJECTS + b"\n")
                  trees = (
                      ("refs/gate/base", [(parent_files[sources.get(p, p)], p) for p in paths
                                          if sources.get(p, p) in parent_files]),
                      ("refs/gate/scan", [(merge_files[p], p) for p in paths if p in merge_files]))
                  commit = None
                  for ref, files in trees:
                      index = dict(env, GIT_INDEX_FILE=scan + ".index")
                      git("-C", scan, "update-index", "--add", "-z", "--index-info", env=index,
                          data=b"".join(b"100644 " + oid + b"\t" + p + b"\0" for oid, p in files))
                      tree = git("-C", scan, "write-tree", env=index).decode().strip()
                      if os.path.exists(index["GIT_INDEX_FILE"]):
                          os.remove(index["GIT_INDEX_FILE"])
                      above = ("-p", commit) if commit else ()
                      commit = git("-C", scan, "commit-tree", "--no-gpg-sign", *above, "-m",
                                   f"lines added by merge {merge}, against parent {number}", tree,
                                   env=env).decode().strip()
                      git("-C", scan, "update-ref", ref, commit)
          PY
            echo "::error::Could not read the lines merge commits added (see the log above). This is a gate error, not a finding."
            exit 1
          }
          for dir in "$MERGES"/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            merge=${name%.*}
            echo "Scanning lines added by merge $merge, against parent ${name##*.}"
            # Run from the checkout, like the scan above: the same config (a
            # relative [extend] path resolves the same way) and the checkout's
            # .gitleaksignore ("path:rule:line" entries; lines keep their real
            # numbers). Exit code 3 means a leak; any other failure is a scan
            # error, never reported as a secret. The runner's own git config is
            # ignored here too (color.ui=always would hide every line). Findings
            # that touch only lines already in a parent are not new; a finding
            # on the whole file (a path rule, no line) and an unreadable report
            # always count.
            rc=0
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 gitleaks git "$dir" \
              --log-opts="refs/gate/base..refs/gate/scan" \
              --gitleaks-ignore-path . \
              --redact \
              --config .gitleaks.toml \
              --exit-code 3 \
              --report-format json \
              --report-path "$REPORTS/gitleaks-merge-$name.json" || rc=$?
            if [ "$rc" = 3 ]; then
              real=$(python3 -I - "$REPORTS/gitleaks-merge-$name.json" "$MERGES/$merge.json" <<'NEW'
          import json, sys
          fresh = json.load(open(sys.argv[2]))
          print(sum(1 for f in json.load(open(sys.argv[1]))
                    if f["File"] not in fresh or f["StartLine"] < 1
                    or set(range(f["StartLine"], f["EndLine"] + 1)) & set(fresh[f["File"]])))
          NEW
              ) || real=unknown
              if [ "$real" != 0 ]; then
                # The other views and merges are still scanned, so one run reports
                # every merge finding (a secret in an ordinary commit fails above).
                echo "::error::Potential secret added by a merge commit ($merge, a conflict resolution; seen against parent ${name##*.}). Review the log above. $SECRET_HELP"
                leaked=1
              else
                echo "::notice::Merge $merge: the findings are on lines already in a parent, so they are not new."
              fi
            elif [ "$rc" != 0 ]; then
              echo "::error::The scan of merge $merge could not run (gitleaks exit $rc, see the log above). This is a gate error, not a finding."
              exit 1
            fi
          done
          [ -z "${leaked:-}" ] || exit 1

      - name: Upload findings (kept even when the job fails)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks-reports/
          if-no-files-found: ignore
